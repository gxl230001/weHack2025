<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LooKey Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      overflow: hidden;
      text-align: center;
      background: #f0f0f0;
    }

    h1 {
      margin-top: 20px;
      font-size: 28px;
    }

    #instructions {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .calibration-dot {
      width: 30px;
      height: 30px;
      background-color: red;
      border-radius: 50%;
      position: absolute;
      opacity: 0.8;
      cursor: pointer;
      z-index: 9999;
    }

    #Pt1 { top: 10%; left: 10%; }
    #Pt2 { top: 10%; left: 45%; }
    #Pt3 { top: 10%; left: 80%; }

    #Pt4 { top: 45%; left: 10%; }
    #Pt5 { top: 45%; left: 45%; }
    #Pt6 { top: 45%; left: 80%; }

    #Pt7 { top: 80%; left: 10%; }
    #Pt8 { top: 80%; left: 45%; }
    #Pt9 { top: 80%; left: 80%; }

    canvas#overlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>
  <h1>LooKey Eye Tracker</h1>
  <p id="instructions">Click each red dot 5 times to calibrate.</p>

  <!-- Calibration dots -->
  <div class="calibration-dot" id="Pt1"></div>
  <div class="calibration-dot" id="Pt2"></div>
  <div class="calibration-dot" id="Pt3"></div>
  <div class="calibration-dot" id="Pt4"></div>
  <div class="calibration-dot" id="Pt5"></div>
  <div class="calibration-dot" id="Pt6"></div>
  <div class="calibration-dot" id="Pt7"></div>
  <div class="calibration-dot" id="Pt8"></div>
  <div class="calibration-dot" id="Pt9"></div>

  <canvas id="overlay"></canvas>

  <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
  <script>
    const requiredClicks = 5;
    let clickCounts = {};
    let calibrated = false;

    window.onload = async () => {
      for (let i = 1; i <= 9; i++) {
        const id = `Pt${i}`;
        clickCounts[id] = 0;
        const dot = document.getElementById(id);
        dot.style.display = "block";
        dot.addEventListener("click", () => handleCalibrationClick(id));
      }

      await webgazer.setRegression("ridge")
        .setGazeListener((data) => {
          if (calibrated && data) {
            drawDot(data.x, data.y);
          }
        }).begin();

      webgazer.showVideoPreview(true)
              .showPredictionPoints(true)
              .showFaceOverlay(true);
    };

    function handleCalibrationClick(id) {
      if (calibrated) return;

      clickCounts[id]++;
      const dot = document.getElementById(id);
      dot.style.opacity = (1 - clickCounts[id] * 0.15).toString();

      if (clickCounts[id] >= requiredClicks) {
        dot.style.display = "none";
      }

      const allDone = Object.values(clickCounts).every(count => count >= requiredClicks);
      if (allDone) {
        document.getElementById("instructions").textContent = "✅ Calibration complete. Gaze tracking is active!";
        calibrated = true;
      }
    }

    function drawDot(x, y) {
      const canvas = document.getElementById("overlay");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, 2 * Math.PI);
      ctx.fillStyle = "rgba(0, 150, 255, 0.6)";
      ctx.fill();
    }
  </script>
</body>
</html>
